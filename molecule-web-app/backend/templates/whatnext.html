<!DOCTYPE html>
<html>
<head>
  <title>Molecule Viewer</title>
</head>
<body>
  <h1>Clickable Molecule</h1>

  <!-- SVG injected here -->
  <div id="mol-container">
    {{ svg|safe }}
  </div>
  <img src="data:image/png;base64,{{ png_bin }}" />


  <script>
    document.addEventListener("DOMContentLoaded", function() {
      document.querySelectorAll("[id^='atom-']").forEach(el => {
        el.addEventListener("click", e => {
          alert("You clicked " + e.target.id);
        });
      });
    });
  </script>
</body>
</html>
