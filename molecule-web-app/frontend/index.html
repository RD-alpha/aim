<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecule Web App</title>
    <link rel="stylesheet" href="styles/style.css">
    <script src="scripts/app.js" defer></script>
</head>
<body>
    <div id="app">
        <div id="main-container">
            <h1>Rules-Based Chemistry</h1>
            <div>
            <label for="smiles-input">Enter SMILES:</label>
            <input type="text" id="smiles-input" placeholder="Enter SMILES string here">
            <div id="input-mol"></div>
            </div>
            <div>
                <input type="checkbox" id="cleanup-checkbox" checked>
                <label for="cleanup-checkbox">Clean up molecules</label>
                <input type="checkbox" id="kekulise-checkbox">
                <label for="kekulise-checkbox">Aromatic reactivity?</label>
            </div>
            <button id="convert-button">Apply rules</button>
            <button id="chain-button">Next step</button>
            <button id="random-suggestion-button">Random suggestion</button>
            <div id="results-container"></div>
        </div>
        <div id="history-container"">
            <button id="toggle-history-button" class="arrow-button">→</button>
            <h2>History</h2>
            <div id="history-list"></div>
            <button id="clear-history-button">Clear History</button>
            <button id="save-history-button">Save History</button>
        </div>
    </div>

    <!-- Popup Modal -->
    <div id="info-modal" class="modal">
        <div class="modal-content">
            <span id="close-modal" class="close-button">&times;</span>
            <h2>Thank you for volunteering your chemistry expertise!</h2>
            <p>Guidance for consistent training</p>
            <a href="help.html">Help</a>
        </div>
    </div>
</body>
</html>
