<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecule Web App</title>
    <link rel="stylesheet" href="styles/style.css">
    <script src="scripts/app.js" defer></script>
</head>
<body>
    <div id="app">
        <div id="main-container">
        <h1>Rules-Based Chemistry</h1>
        <label for="smiles-input">Enter SMILES:</label>
        <input type="text" id="smiles-input" placeholder="Enter SMILES string here">
        <div>
            <input type="checkbox" id="cleanup-checkbox">
            <label for="cleanup-checkbox">Clean up molecules</label>
            <input type="checkbox" id="kekulise-checkbox">
            <label for="kekulise-checkbox">Aromatic reactivity?</label>
        </div>
        <button id="convert-button">Apply rules</button>
        <div id="results-container"></div>
        </div>
        <div id="history-container">
            <h2>History</h2>
            <div id="history-list"></div>
            <button id="clear-history-button">Clear History</button>
            <button id="save-history-button">Save History</button>
        </div>
    </div>
   
</body>
</html>
